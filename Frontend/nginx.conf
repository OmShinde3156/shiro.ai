server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|activity|answer-planner|api-keys|chat|create-timetable|dashboard|documents|features|feynman|flashcards|generate-flashcards|generate-mindmap|generate-podcast|generate-quiz|guest|health|insights|login|logout|metrics|mindmap-details|mindmaps|podcast-status|podcasts|progress|quiz-history|request-otp|rooms|speak|static|stt|student-insights|study-flashcard|submit-quiz|summaries|summarize|timetable|translate|update-timetable-progress|upload-avatar|upload-document|upload-url|users|verify-otp|voice-samples) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
