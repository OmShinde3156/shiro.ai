<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Neon Scholar - SRS Session</title>
<!-- Google Fonts: Manrope (Display) & Inter (Body) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#422c00",
                        "surface-variant": "#32353c",
                        "surface-container": "#1d2026",
                        "surface-container-highest": "#32353c",
                        "on-error-container": "#ffdad6",
                        "secondary": "#edb1ff",
                        "tertiary-container": "#ffc559",
                        "on-secondary-container": "#e69dff",
                        "on-primary-fixed": "#001f28",
                        "inverse-primary": "#00677f",
                        "secondary-container": "#70238f",
                        "inverse-on-surface": "#2e3037",
                        "background": "#10131a",
                        "tertiary": "#ffe7c5",
                        "outline": "#879297",
                        "surface-container-high": "#272a31",
                        "on-tertiary-container": "#745100",
                        "on-primary": "#003543",
                        "inverse-surface": "#e1e2eb",
                        "surface": "#10131a",
                        "outline-variant": "#3e484d",
                        "on-background": "#e1e2eb",
                        "tertiary-fixed": "#ffdea9",
                        "primary-fixed": "#b6ebff",
                        "primary-fixed-dim": "#69d4f7",
                        "on-surface-variant": "#bdc8ce",
                        "on-secondary": "#520070",
                        "primary-container": "#72dcff",
                        "secondary-fixed": "#f9d8ff",
                        "on-secondary-fixed": "#320046",
                        "on-primary-container": "#006076",
                        "primary": "#cdf0ff",
                        "on-error": "#690005",
                        "surface-container-low": "#191c22",
                        "surface-dim": "#10131a",
                        "on-primary-fixed-variant": "#004e60",
                        "surface-tint": "#69d4f7",
                        "surface-bright": "#363940",
                        "on-tertiary-fixed": "#271900",
                        "error-container": "#93000a",
                        "tertiary-fixed-dim": "#f6bd52",
                        "surface-container-lowest": "#0b0e14",
                        "secondary-fixed-dim": "#edb1ff",
                        "on-tertiary-fixed-variant": "#5e4100",
                        "on-surface": "#e1e2eb",
                        "error": "#ffb4ab",
                        "on-secondary-fixed-variant": "#6e208c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1.5rem",
                        "3xl": "2rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-dim text-on-surface font-body min-h-screen flex flex-col relative overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Glows (Neon Editorial Style) -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-secondary/5 rounded-full blur-[150px]"></div>
</div>
<!-- 
        Session Header 
        Note: Global Navigation (BottomNavBar/NavigationDrawer) is SUPPRESSED here 
        because this is a Task-Focused, Linear study session (Rule: Shell Visibility & Relevance).
    -->
<header class="relative z-50 w-full px-6 py-6 flex items-center justify-between">
<!-- Close/Pause Action -->
<button class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/15 text-on-surface-variant hover:text-on-surface transition-colors shadow-[0_4px_20px_rgba(0,0,0,0.5)] group">
<span class="material-symbols-outlined text-2xl group-active:scale-90 transition-transform">close</span>
</button>
<!-- Centered Progress Bar -->
<div class="flex flex-col items-center justify-center flex-1 max-w-md mx-6">
<div class="flex items-center justify-between w-full mb-2">
<span class="font-label text-[10px] uppercase tracking-[0.15em] text-on-surface-variant font-bold">Session Progress</span>
<span class="font-label text-xs tracking-widest text-primary font-bold">14 / 50</span>
</div>
<!-- Progress Track -->
<div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden border border-outline-variant/10">
<!-- Progress Fill (Primary Neon) -->
<div class="h-full bg-gradient-to-r from-inverse-primary to-primary rounded-full shadow-[0_0_10px_rgba(114,220,255,0.5)]" style="width: 28%;"></div>
</div>
</div>
<!-- Optional Action (e.g., Settings/More) -->
<button class="flex items-center justify-center w-12 h-12 rounded-full text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-2xl group-active:scale-90 transition-transform">more_vert</span>
</button>
</header>
<!-- Main Canvas: Focused Flashcard Area -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 w-full max-w-4xl mx-auto pb-12">
<!-- The Glassmorphism Flashcard -->
<div class="relative w-full aspect-[4/3] md:aspect-[16/9] max-w-3xl group perspective-1000 cursor-pointer">
<!-- Card Container (Front) -->
<div class="absolute inset-0 w-full h-full bg-surface-container-highest/80 backdrop-blur-3xl rounded-[2.5rem] p-8 md:p-16 flex flex-col items-center justify-center text-center shadow-[0_10px_50px_-10px_rgba(0,0,0,0.8),0_0_30px_rgba(114,220,255,0.05)] border border-outline-variant/15 transition-transform duration-500 transform-gpu group-hover:scale-[1.01] group-active:scale-[0.99]">
<!-- Deck / Tag Label -->
<div class="absolute top-8 text-center w-full left-0">
<span class="font-label text-[10px] uppercase tracking-[0.2em] text-secondary font-bold bg-secondary-container/10 px-4 py-1.5 rounded-full border border-secondary/20">
                        Neural Networks
                    </span>
</div>
<!-- The Question -->
<h2 class="font-headline text-3xl md:text-5xl font-extrabold tracking-tight text-on-surface leading-tight text-balance">
                    What is backpropagation?
                </h2>
<!-- Hint / Interaction Cue -->
<div class="absolute bottom-8 text-center w-full left-0 flex flex-col items-center opacity-60">
<span class="material-symbols-outlined text-on-surface-variant mb-1" style="font-variation-settings: 'FILL' 0;">touch_app</span>
<span class="font-label text-xs uppercase tracking-widest text-on-surface-variant">Tap to reveal</span>
</div>
</div>
<!-- 
                Ghost border effect to emphasize the card shape 
                without using a solid bright line.
            -->
<div class="absolute inset-0 rounded-[2.5rem] border border-primary/5 pointer-events-none"></div>
</div>
<!-- Difficulty Controls (Neon Glows) -->
<div class="w-full max-w-2xl mx-auto mt-12 md:mt-16 grid grid-cols-4 gap-3 md:gap-6">
<!-- Again Button -->
<button class="flex flex-col items-center justify-center py-4 rounded-2xl bg-surface-container-low border border-outline-variant/20 hover:bg-error-container/10 hover:border-error/30 hover:shadow-[0_0_20px_rgba(255,180,171,0.1)] transition-all duration-300 group">
<span class="font-label text-xs md:text-sm uppercase tracking-widest text-on-surface-variant group-hover:text-error font-bold mb-1 transition-colors">Again</span>
<span class="font-body text-[10px] text-outline opacity-60 group-hover:opacity-100 transition-opacity">&lt; 1m</span>
</button>
<!-- Hard Button -->
<button class="flex flex-col items-center justify-center py-4 rounded-2xl bg-surface-container-low border border-outline-variant/20 hover:bg-secondary-container/20 hover:border-secondary/40 hover:shadow-[0_0_25px_rgba(221,139,251,0.2)] transition-all duration-300 group">
<span class="font-label text-xs md:text-sm uppercase tracking-widest text-on-surface-variant group-hover:text-secondary font-bold mb-1 transition-colors">Hard</span>
<span class="font-body text-[10px] text-outline opacity-60 group-hover:opacity-100 transition-opacity">6m</span>
</button>
<!-- Good Button (Primary Emphasis) -->
<button class="relative flex flex-col items-center justify-center py-4 rounded-2xl bg-primary/10 border border-primary/30 shadow-[0_0_30px_rgba(114,220,255,0.15)] hover:bg-primary/20 hover:border-primary/50 hover:shadow-[0_0_40px_rgba(114,220,255,0.3)] transition-all duration-300 group overflow-hidden">
<!-- Inner highlight glow -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/0 to-primary/10 pointer-events-none"></div>
<span class="font-label text-xs md:text-sm uppercase tracking-widest text-primary font-bold mb-1 relative z-10">Good</span>
<span class="font-body text-[10px] text-primary-fixed-dim opacity-80 relative z-10">10m</span>
</button>
<!-- Easy Button -->
<button class="flex flex-col items-center justify-center py-4 rounded-2xl bg-surface-container-low border border-outline-variant/20 hover:bg-tertiary-container/10 hover:border-tertiary/30 hover:shadow-[0_0_20px_rgba(255,231,197,0.15)] transition-all duration-300 group">
<span class="font-label text-xs md:text-sm uppercase tracking-widest text-on-surface-variant group-hover:text-tertiary font-bold mb-1 transition-colors">Easy</span>
<span class="font-body text-[10px] text-outline opacity-60 group-hover:opacity-100 transition-opacity">4d</span>
</button>
</div>
</main>
</body></html>
