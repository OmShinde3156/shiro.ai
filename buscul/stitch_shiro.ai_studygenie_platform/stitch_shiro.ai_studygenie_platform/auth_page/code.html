<body class="bg-surface-dim text-on-surface font-body min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container opacity-[0.03] blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container opacity-[0.04] blur-[100px]"></div>
<!-- Decorative grid overlay -->
<div class="absolute inset-0 opacity-[0.02]" style="background-image: radial-gradient(circle at 1px 1px, #e1e2eb 1px, transparent 0); background-size: 32px 32px;"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto px-6 py-12 z-10 relative">
<!-- Authentication Card -->
<div class="glass-panel rounded-2xl p-8 sm:p-10 neon-glow-primary">
<!-- Header -->
<div class="text-center mb-10">
<h1 class="font-headline text-3xl font-black text-primary tracking-tighter uppercase mb-4 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-4xl" data-icon="blur_on" style="font-variation-settings: 'FILL' 1;">blur_on</span>
                    Shiro.AI
                </h1>
<h2 class="font-headline text-2xl font-bold tracking-tight text-on-surface">Welcome back, Scholar</h2>
<p class="text-on-surface-variant font-label uppercase tracking-widest text-xs mt-2 opacity-80">Authentication Protocol</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-xs uppercase tracking-wider text-on-surface-variant ml-1" for="email">Email Coordinates</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-full px-4 py-3 transition-all duration-300 input-focus-ring outline-none">
<span class="material-symbols-outlined text-outline mr-3" data-icon="mail">mail</span>
<input class="bg-transparent border-none outline-none w-full text-on-surface font-body placeholder:text-outline/50 focus:ring-0 p-0" id="email" placeholder="scholar@academy.net" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-baseline ml-1 mr-1">
<label class="block font-label text-xs uppercase tracking-wider text-on-surface-variant" for="password">Security Cipher</label>
<a class="font-label text-[10px] uppercase tracking-wider text-primary hover:text-primary-fixed transition-colors" href="#">Recover</a>
</div>
<div class="relative flex items-center bg-surface-container-lowest rounded-full px-4 py-3 transition-all duration-300 input-focus-ring outline-none">
<span class="material-symbols-outlined text-outline mr-3" data-icon="key">key</span>
<input class="bg-transparent border-none outline-none w-full text-on-surface font-body placeholder:text-outline/50 focus:ring-0 p-0" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-gradient-primary text-on-primary-fixed font-headline font-bold text-lg rounded-xl py-4 mt-8 hover:opacity-90 transition-opacity flex justify-center items-center gap-2 shadow-[0_0_20px_rgba(114,220,255,0.2)]" type="submit">
                    Initiate Link
                    <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Separation / Social Login -->
<div class="mt-10">
<div class="relative flex items-center justify-center mb-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-outline-variant/30"></div>
</div>
<span class="relative px-4 bg-surface-container font-label text-[10px] uppercase tracking-widest text-on-surface-variant rounded-full">Alternative Auth</span>
</div>
<div class="flex gap-4 justify-center">
<button aria-label="Login with Google" class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-high hover:bg-surface-container-highest transition-colors border border-outline-variant/20">
