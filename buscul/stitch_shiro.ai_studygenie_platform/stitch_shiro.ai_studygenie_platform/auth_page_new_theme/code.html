<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SHIRO.AI - Authentication</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#001f27",
                        "on-tertiary-container": "#a2f825",
                        "surface-container-lowest": "#0c0c1f",
                        "on-secondary-fixed-variant": "#6700b5",
                        "on-tertiary-fixed-variant": "#2f4f00",
                        "inverse-surface": "#e2e0fc",
                        "surface-dim": "#111125",
                        "outline-variant": "#4c4354",
                        "on-surface": "#e2e0fc",
                        "tertiary-container": "#446f00",
                        "surface-bright": "#37374d",
                        "on-tertiary-fixed": "#102000",
                        "on-primary-container": "#afeaff",
                        "secondary": "#dcb8ff",
                        "tertiary-fixed-dim": "#8bdc00",
                        "on-surface-variant": "#cfc2d7",
                        "surface-container-highest": "#333348",
                        "surface-container": "#1e1e32",
                        "on-error": "#690005",
                        "outline": "#988ca0",
                        "on-tertiary": "#1f3700",
                        "on-primary": "#003642",
                        "primary": "#3cd7ff",
                        "on-secondary-container": "#dcb7ff",
                        "primary-container": "#006d84",
                        "error-container": "#93000a",
                        "surface": "#111125",
                        "on-error-container": "#ffdad6",
                        "surface-tint": "#3cd7ff",
                        "on-secondary": "#480081",
                        "error": "#ffb4ab",
                        "inverse-on-surface": "#2f2e43",
                        "secondary-container": "#7701d0",
                        "inverse-primary": "#00677e",
                        "surface-variant": "#333348",
                        "on-secondary-fixed": "#2c0051",
                        "secondary-fixed": "#efdbff",
                        "surface-container-low": "#1a1a2e",
                        "primary-fixed-dim": "#3cd7ff",
                        "on-background": "#e2e0fc",
                        "primary-fixed": "#b4ebff",
                        "background": "#111125",
                        "tertiary-fixed": "#a3fa28",
                        "surface-container-high": "#28283d",
                        "tertiary": "#8bdc00",
                        "on-primary-fixed-variant": "#004e5f",
                        "secondary-fixed-dim": "#dcb8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col antialiased selection:bg-primary/30 selection:text-primary">
<!-- Navbar: Suppressed for Auth Flow -->
<!-- Main Content -->
<main class="flex-1 flex items-center justify-center p-4 md:p-8 relative overflow-hidden">
<!-- Atmospheric Background Depth -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40 mix-blend-screen">
<div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-secondary-container/20 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-[100px]"></div>
</div>
<!-- Auth Container -->
<div class="relative z-10 w-full max-w-md">
<!-- Prism Wrapper -->
<div class="bg-surface-container-low/60 backdrop-blur-2xl rounded-[1.5rem] p-8 md:p-10 shadow-[0_30px_60px_rgba(103,0,181,0.08)] border border-outline-variant/15 flex flex-col gap-8">
<!-- Header / Brand -->
<div class="text-center flex flex-col items-center gap-4">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center shadow-[0_10px_30px_rgba(220,184,255,0.1)] mb-2 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-secondary/20 to-primary/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<span class="material-symbols-outlined text-4xl text-secondary" style="font-variation-settings: 'FILL' 1;">bubble_chart</span>
</div>
<div>
<h1 class="font-headline font-extrabold text-3xl tracking-tight text-secondary">SHIRO.AI</h1>
<p class="font-body text-on-surface-variant mt-2 text-sm">Access your cognitive workspace.</p>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Input Group: Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-xs tracking-wide text-on-surface-variant/80 ml-1" for="email">EMAIL PROTOCOL</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/50 rounded-xl py-3.5 pl-11 pr-4 border-b-2 border-transparent focus:border-primary focus:ring-0 transition-all duration-300 font-label text-sm" id="email" placeholder="user@domain.com" required="" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center ml-1">
<label class="font-label text-xs tracking-wide text-on-surface-variant/80" for="password">SECURITY KEY</label>
<a class="font-label text-xs text-primary hover:text-primary-fixed-dim transition-colors" href="#">Recover Access</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface placeholder:text-outline/50 rounded-xl py-3.5 pl-11 pr-12 border-b-2 border-transparent focus:border-primary focus:ring-0 transition-all duration-300 font-label text-sm" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Action -->
<button class="mt-4 w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-sm tracking-wide py-4 rounded-xl hover:shadow-[0_0_20px_rgba(60,215,255,0.4)] transition-all duration-300 active:scale-[0.98] relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">
                            INITIALIZE SESSION
                            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
<!-- Footer Links -->
<div class="text-center mt-2 border-t border-outline-variant/15 pt-6">
<p class="font-body text-sm text-on-surface-variant">
                        New to the network? 
                        <a class="text-secondary font-semibold hover:text-secondary-fixed transition-colors" href="#">Request Clearance</a>
</p>
</div>
</div>
</div>
</main>
<!-- Bottom Nav: Suppressed for Auth Flow -->
</body></html>
